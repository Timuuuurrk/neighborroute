spring.application.name=order-service
server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/neighborroute_orders
spring.datasource.username=neighborroute
spring.datasource.password=local_dev_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

neighborroute.batch-service.base-url=http://localhost:8081

neighborroute.cancellation.recovery.enabled=true
neighborroute.cancellation.recovery.delay-ms=30000
neighborroute.cancellation.recovery.initial-delay-ms=30000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

neighborroute.outbox.publisher.enabled=true
neighborroute.outbox.delay-ms=3000
neighborroute.outbox.initial-delay-ms=10000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true