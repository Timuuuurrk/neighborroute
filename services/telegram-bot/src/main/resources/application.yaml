spring:
  application:
    name: telegram-bot

  datasource:
    url: jdbc:postgresql://localhost:5435/neighborroute_telegram
    username: neighborroute
    password: ${TELEGRAM_DB_PASSWORD}

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: neighborroute-telegram-bot
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8082

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

services:
  order:
    base-url: http://127.0.0.1:8080/api/v1/orders
  batch:
    base-url: http://127.0.0.1:8081/api/v1/batches

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true